server:
  port: 8080

spring:
  application:
    name: answer-evaluation-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/migrate-compat.sql

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-production-0123456789abcdef0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  upload:
    max-size-bytes: 26214400
    allowed-mime-types: image/jpeg,image/png,image/webp,application/pdf
    storage-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:3000}
  analytics:
    question-minimum-sample-size: ${QUESTION_DIFFICULTY_MIN_SAMPLE_SIZE:3}
    similarity-review-threshold: ${SIMILARITY_REVIEW_THRESHOLD:0.85}
    similarity-text-weight: ${SIMILARITY_TEXT_WEIGHT:0.70}
    consistency-min-similarity: ${CONSISTENCY_MIN_SIMILARITY:0.85}
    consistency-max-concept-difference: ${CONSISTENCY_MAX_CONCEPT_DIFFERENCE:0.10}
    consistency-min-mark-difference: ${CONSISTENCY_MIN_MARK_DIFFERENCE:2.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.aes: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/aes-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/answer_eval}
    username: ${SPRING_DATASOURCE_USERNAME:aes_user}
    password: ${SPRING_DATASOURCE_PASSWORD:aes_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
